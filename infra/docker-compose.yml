# Local development on your own machine (the platform uses its own containers). The live setup is
# docker-compose.prod.yml at the repository root.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
    ports: ["5432:5432"]
  api:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://app:app@db:5432/app
      SECRET_KEY: dev-secret
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
    volumes: ["../apps/api:/app"]
    ports: ["8000:8000"]
    depends_on: [db]
  web:
    image: node:20-slim
    working_dir: /app
    command: ["sh", "-c", "npm install --no-audit --no-fund && npx expo start --web --port 8081"]
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:8000
    volumes: ["../apps/web:/app"]
    ports: ["8081:8081"]
